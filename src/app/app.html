<div class="flex min-h-screen bg-[#F9FAFB]">
  <!-- SIDEBAR -->
  <app-sidebar></app-sidebar>

  <!-- MAIN AREA -->
  <div class="flex-1 px-[24px]">
    <!-- TOP NAVBAR -->
    <div class="flex items-center justify-between pt-[30px]">
      <!-- DASHBOARD TITLE -->
      <h1 class="text-[20px] font-medium leading-[30px] text-[#23272E]">Dashboard</h1>

      <!-- RIGHT SECTION -->
      <div class="flex items-center gap-[24px] mr-4">
        <!-- SEARCH BAR -->
        <div
          class="flex items-center justify-between w-[359px] h-[31px] bg-white px-[12px] rounded-[10px]"
        >
          <span class="text-[14px] font-medium text-[#7B7878]"> Search... </span>

          <img src="/lens.png" class="w-[16px] h-[16px] object-contain" />
        </div>

        <!-- CART ICON -->
        <img src="/cart.png" class="w-[18px] h-[17px] object-contain" />

        <!-- NOTIFICATION ICON -->
        <img src="/bell.png" class="w-[16px] h-[17px] object-contain" />

        <!-- PROFILE -->
        <div class="w-[31px] h-[31px] rounded-full overflow-hidden shadow-[0px_3px_4px_#3B82F6]">
          <img src="/profile2.png" alt="profile" class="w-full h-full object-cover" />
        </div>
      </div>
    </div>
    <app-stats></app-stats>
    <div class="flex gap-[24px] mt-[24px]">
      <app-sales-chart></app-sales-chart>
      <app-top-selling></app-top-selling>
    </div>
    <div class="flex gap-[24px] my-[24px]">
      <app-doughnut-chart></app-doughnut-chart>
      <app-recent-orders></app-recent-orders>
      <app-recent-activity></app-recent-activity>
    </div>
  </div>
</div>
