<div class="w-[215px] h-screen bg-white flex flex-col justify-between">
  <div class="px-[30px] pt-[30px]">
    <div class="flex items-center gap-[12.5px] mb-[40px]">
      <img src="logo.png" alt="eva logo" class="w-[35px] h-[30px] object-contain" />

      <span class="text-[25px] font-bold leading-[30px] text-[#23272E]"> eva </span>
    </div>

    <div class="flex flex-col gap-[12px]">
      <div
        class="flex items-center gap-[12px] h-[39px] px-[12px] -ml-3 rounded-[8px] bg-[#3B82F6] cursor-pointer"
      >
        <img src="dashboard-icon.png" class="w-[16px] h-[16px] object-contain" />

        <span class="text-[12px] font-medium leading-[30px] text-white"> Dashboard </span>
      </div>

      <div class="flex items-center gap-[12px] h-[30px] cursor-pointer">
        <img src="orders-icon.png" class="w-[17px] h-[16px] object-contain" />

        <span class="text-[12px] font-medium leading-[30px] text-[#23272E]"> Order </span>
      </div>

      <div class="flex items-center gap-[12px] h-[30px] cursor-pointer">
        <img src="products-icon.png" class="w-[16px] h-[16px] object-contain" />

        <span class="text-[12px] font-medium leading-[30px] text-[#23272E]"> Products </span>
      </div>

      <div class="flex items-center gap-[12px] h-[30px] cursor-pointer">
        <img src="customers-icon.png" class="w-[14px] h-[16px] object-contain" />

        <span class="text-[12px] font-medium leading-[30px] text-[#23272E]"> Customers </span>
      </div>

      <div class="flex items-center gap-[12px] h-[30px] cursor-pointer">
        <img src="settings-icon.png" class="w-[15px] h-[16px] object-contain" />

        <span class="text-[12px] font-medium leading-[30px] text-[#23272E]"> Settings </span>
      </div>
    </div>
  </div>

  <div class="px-[30px] pb-[30px]">
    <p class="text-[12px] font-medium text-[#1F2A40] leading-[30px] mb-[10px]">Quick Actions</p>

    <div class="flex flex-col gap-[18px] mb-[50px] ml-4">
      <div class="flex items-center gap-[12px] cursor-pointer">
        <img src="add-product-icon.png" class="w-[16px] h-[16px] object-contain" />

        <span class="text-[12px] font-medium text-[#7B7878]"> Add Products </span>
      </div>

      <div class="flex items-center gap-[12px] cursor-pointer -ml-1.5">
        <img src="manage-orders-icon.png" class="w-[22px] h-[16px] object-contain" />

        <span class="text-[12px] font-medium text-[#7B7878]"> Manage Orders </span>
      </div>
    </div>

    <div class="flex items-center gap-[12px] cursor-pointer">
      <img src="logout-icon.png" class="w-[16px] h-[16px] object-contain" />

      <span class="text-[12px] font-medium"> Logout </span>
    </div>
  </div>
</div>
